<text x="10" y="46.5" font-size="4.3" >02. Right shelf cabinet</text>
<text x="10" y="56" font-size="4.3" >03. Makeup drawer cabinet</text>
<text x="10" y="65.5" font-size="4.3" >04. TV + makeup centre</text>
<text x="10" y="75" font-size="4.3" >05. Left top cabinet</text>
<text x="10" y="84.5" font-size="4.3" >06. Centre top cabinet</text>
<text x="10" y="94" font-size="4.3" >07. Right top cabinet</text>
<text x="10" y="103.5" font-size="4.3" >08. Scribe_Strips</text>
<text x="10" y="187" font-size="4.3" >Complete doors / hardware fitting only when selected hardware and site fixing are confirmed.</text>
