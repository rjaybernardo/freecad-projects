<text x="10" y="16" font-size="6.2" font-weight="bold">CABINET | BUILD ONE MODULE AT A TIME</text>
<text x="10" y="25" font-size="4.3" >Finish the current module and its drawers, then move to the next numbered module.</text>
<text x="10" y="201" font-size="4.3" >Assembly order is separate from sheet cutting order; keep part IDs on every piece.</text>
