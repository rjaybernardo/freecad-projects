<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<rect width="297" height="210" fill="white"/>
<style>text {font-family:DejaVu Sans,sans-serif;fill:#172a38}</style>
<text x="10" y="16" font-size="6.2" font-weight="bold">BED | BUILD ONE MODULE AT A TIME</text>
<text x="10" y="25" font-size="4.3" >Finish the current module and its drawers, then move to the next numbered module.</text>
<text x="10" y="201" font-size="4.3" >Assembly order is separate from sheet cutting order; keep part IDs on every piece.</text>
<text x="10" y="37" font-size="4.3" >01. Left head lift-up box</text>
<text x="10" y="46.5" font-size="4.3" >02. Right head lift-up box</text>
<text x="10" y="56" font-size="4.3" >03. Left side drawer bay 1</text>
<text x="10" y="65.5" font-size="4.3" >04. Right side drawer bay 1</text>
<text x="10" y="75" font-size="4.3" >05. Left side drawer bay 2</text>
<text x="10" y="84.5" font-size="4.3" >06. Right side drawer bay 2</text>
<text x="10" y="94" font-size="4.3" >07. Left foot drawer bay</text>
<text x="10" y="103.5" font-size="4.3" >08. Right foot drawer bay</text>
<text x="10" y="113" font-size="4.3" >09. Left nightstand</text>
<text x="10" y="122.5" font-size="4.3" >10. Right nightstand</text>
<text x="10" y="132" font-size="4.3" >11. Left upper cabinet</text>
<text x="10" y="141.5" font-size="4.3" >12. Right upper cabinet</text>
<text x="10" y="151" font-size="4.3" >13. Plain backboard</text>
<text x="10" y="160.5" font-size="4.3" >14. Overhead bridge cabinet</text>
<text x="10" y="170" font-size="4.3" >15. Scribe_Strips</text>
<text x="10" y="187" font-size="4.3" >Complete doors / hardware fitting only when selected hardware and site fixing are confirmed.</text>
</svg>